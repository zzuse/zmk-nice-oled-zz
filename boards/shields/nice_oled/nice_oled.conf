CONFIG_NICE_EPAPER_ON=n

# The central screen peaks at ~3.2 KB of display-thread stack, over ZMK's 3072 default;
# the overflow corrupts the neighbouring stack and crashes at boot. Set here, not in
# Kconfig.defconfig: ZMK defines this symbol (with its default) before shield defconfigs
# are sourced, so a defconfig default never wins. A user's .conf can still override it.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Debug: fail loudly on LVGL malloc failure instead of writing through NULL.
# LV_ASSERT_HANDLER is __ASSERT_NO_MSG, so CONFIG_ASSERT must be on for it to fire.
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=n
CONFIG_LV_USE_ASSERT_MALLOC=y
